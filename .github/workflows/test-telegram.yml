name: Telegram Bildirim Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Telegram mesajı gönder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
                    print("BOT_TOKEN tanımlı mı:", bool(os.environ.get("BOT_TOKEN")))
          print("CHAT_ID tanımlı mı:", bool(os.environ.get("CHAT_ID")))
          import urllib.request
          import urllib.error
          import urllib.parse

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not token:
              raise SystemExit("BOT_TOKEN boş veya tanımlanmamış.")

          if not chat_id:
              raise SystemExit("CHAT_ID boş veya tanımlanmamış.")

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "Test başarılı! Maçka İSPARK takip sistemi Telegram'a bağlandı."
          }).encode()

          request = urllib.request.Request(url, data=data)

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.loads(response.read().decode())
                  print("Telegram API yanıtı:", json.dumps(result))

          except urllib.error.HTTPError as e:
              print("HTTP durum kodu:", e.code)
              print("Telegram hata yanıtı:", e.read().decode())
              raise SystemExit(1)

          PY
