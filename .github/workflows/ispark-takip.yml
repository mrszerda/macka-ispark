
name: Macka ISPARK Yeni Sistem

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Telegram bağlantısını kontrol et
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error
          import sys

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not token or not chat_id:
              print("HATA: BOT_TOKEN veya CHAT_ID GitHub Secrets içinden gelmedi.")
              sys.exit(1)

          def telegram(method, data=None):
              url = f"https://api.telegram.org/bot{token}/{method}"
              payload = None
              if data is not None:
                  payload = json.dumps(data).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=payload,
                  headers={"Content-Type": "application/json"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", errors="replace")
                  print(f"Telegram HTTP hatası: {e.code}")
                  print(detail[:1000])
                  sys.exit(1)

          me = telegram("getMe")
          if not me.get("ok"):
              print("HATA: Bot token doğrulanamadı.")
              sys.exit(1)

          print("Bot doğrulandı:", me["result"].get("username", "bilinmiyor"))

          result = telegram("sendMessage", {
              "chat_id": chat_id,
              "text": "Maçka İSPARK yeni sistem bağlantı testi başarılı."
          })

          if not result.get("ok"):
              print("HATA: Mesaj gönderilemedi.")
              print(json.dumps(result, ensure_ascii=False))
              sys.exit(1)

          print("BAŞARILI: Telegram mesajı gönderildi.")
          PY
