
name: Macka ISPARK Liste Analizi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Abonelik sayfasını incele
        run: |
          python - <<'PY'
          import urllib.request
          import re

          url = "https://ispark.istanbul/abone/"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  html = r.read().decode("utf-8", "replace")
                  print("HTTP:", r.status)
          except Exception as e:
              print("SAYFA HATASI:", str(e))
              raise SystemExit(1)

          print("HTML uzunluğu:", len(html))
          print("Maçka HTML içinde:", "maçka" in html.lower())
          print("\n--- OTOPARK / API İZLERİ ---")

          patterns = [
              r'<script[^>]+src=["\']([^"\']+)',
              r'https?://[^"\' ]+',
              r'[^"\' ]{0,100}(?:api|otopark|parking|abone)[^"\' ]{0,150}'
          ]

          found = set()
          for pattern in patterns:
              for item in re.findall(pattern, html, re.I):
                  if item not in found:
                      found.add(item)
                      print(item[:300])
                      if len(found) >= 60:
                          break
              if len(found) >= 60:
                  break

          print("\n--- FORMDAKİ SELECT ALANLARI ---")
          for item in re.findall(
              r'<select\b[^>]*>.*?</select>',
              html, re.I | re.S
          ):
              print(re.sub(r'\s+', ' ', item)[:1000])

          print("\nİnceleme tamamlandı.")
          PY
