
name: Macka ISPARK Abonelik Takip

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  check-subscription:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: İSPARK bağlantısını dene
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          import time
          import urllib.request
          import urllib.error
          from html.parser import HTMLParser

          TOKEN = os.environ.get("BOT_TOKEN", "").strip()
          CHAT_ID = os.environ.get("CHAT_ID", "").strip()

          if not TOKEN or not CHAT_ID:
              print("HATA: GitHub Secrets eksik.")
              sys.exit(1)

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
              data = json.dumps({
                  "chat_id": CHAT_ID,
                  "text": message
              }).encode("utf-8")

              req = urllib.request.Request(
                  url,
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  if not result.get("ok"):
                      raise RuntimeError("Telegram API mesajı kabul etmedi.")

          class SelectParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.option = False
                  self.options = []
                  self.value = ""

              def handle_starttag(self, tag, attrs):
                  if tag == "select":
                      self.inside = True
                  elif tag == "option" and self.inside:
                      self.option = True
                      self.value = ""

              def handle_data(self, data):
                  if self.option:
                      self.value += data

              def handle_endtag(self, tag):
                  if tag == "option" and self.option:
                      if self.value.strip():
                          self.options.append(self.value.strip())
                      self.option = False
                  elif tag == "select":
                      self.inside = False

          url = "https://ispark.istanbul/abone/"
          html = None
          last_error = None

          for attempt in range(1, 4):
              print(f"Bağlantı denemesi {attempt}/3")

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) "
                                        "AppleWebKit/537.36 Chrome/130 Safari/537.36",
                          "Accept": "text/html,application/xhtml+xml"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=40) as response:
                      if response.status != 200:
                          raise RuntimeError(
                              f"HTTP durum kodu: {response.status}"
                          )
                      html = response.read().decode("utf-8", "replace")

                  print("İSPARK sayfası alındı.")
                  break

              except Exception as error:
                  last_error = error
                  print("Bağlantı hatası:", str(error))

                  if attempt < 3:
                      time.sleep(5)

          if html is None:
              print("Üç denemede de siteye ulaşılamadı.")

              try:
                  send_telegram(
                      "⚠️ Maçka İSPARK kontrolü yapılamadı.\n"
                      "İSPARK sitesi üç denemede de yanıt vermedi.\n"
                      "Kontenjan durumu bilinmiyor; bu, kontenjanın "
                      "olmadığı anlamına gelmez.\n"
                      f"Hata: {str(last_error)[:250]}"
                  )
                  print("Telegram hata bildirimi gönderildi.")
              except Exception as error:
                  print("Telegram bildirimi de gönderilemedi:", error)

              sys.exit(1)

          parser = SelectParser()
          parser.feed(html)

          print("HTML uzunluğu:", len(html))
          print("Seçenek sayısı:", len(parser.options))
          print("Seçenekler:", parser.options[:100])

          normalize = lambda s: (
              s.casefold().replace("ı", "i")
          )

          found = any(
              "macka" in normalize(option)
              for option in parser.options
          )

          if not parser.options:
              print(
                  "HTML içinde seçim listesi bulunamadı. "
                  "Liste JavaScript ile yükleniyor olabilir."
              )
              send_telegram(
                  "⚠️ İSPARK sayfası açıldı ama abonelik listesi "
                  "HTML içinde bulunamadı. Kontenjan durumu bilinmiyor."
              )
              sys.exit(1)

          if found:
              print("Maçka seçim listesinde bulundu.")
              send_telegram(
                  "🔔 Maçka İSPARK abonelik listesinde bulundu. "
                  "Başvuru ekranından kontrol et:\n"
                  "https://ispark.istanbul/abone/"
              )
          else:
              print(
                  "Maçka doğrudan HTML listesinin içinde yok. "
                  "Bu sonuç tek başına kontenjan yok anlamına gelmez."
              )

          PY
