name: Macka ISPARK Takip

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Telegram bildirimi gönder
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          token = os.environ.get("BOT_TOKEN", "").strip()
          chat_id = os.environ.get("CHAT_ID", "").strip()

          if not token or not chat_id:
              raise SystemExit("BOT_TOKEN veya CHAT_ID eksik.")

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": (
                  "Maçka İSPARK takip sistemi çalışıyor. "
                  "Canlı doluluk ve abonelik kontrolü henüz kurulmadı."
              )
          }).encode()

          request = urllib.request.Request(url, data=data)

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode())

          if not result.get("ok"):
              raise SystemExit("Telegram mesajı gönderilemedi.")

          print("Telegram bildirimi başarıyla gönderildi.")
          PY
